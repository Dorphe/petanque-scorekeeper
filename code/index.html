<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pétanque Scorekeeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pétanque Score</h1>
        
        <div class="score-board">
            <div class="score-pip pip-1">
                <div class="score-value" id="score1">0</div>
                <div class="btn-group">
                    <button class="btn" onclick="changeScore(1, 1)">+</button>
                    <button class="btn" onclick="changeScore(1, -1)">-</button>
                </div>
            </div>
            <div class="score-pip pip-2">
                <div class="score-value" id="score2">0</div>
                <div class="btn-group">
                    <button class="btn" onclick="changeScore(2, 1)">+</button>
                    <button class="btn" onclick="changeScore(2, -1)">-</button>
                </div>
            </div>
        </div>

        <button class="reset-btn" id="reset-btn">Reset Score</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
