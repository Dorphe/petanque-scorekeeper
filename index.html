<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pétanque Scorekeeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="app-title">Pétanque Score</h1>
        </header>
        
        <div class="teams">
            <div class="team-box">
                <input type="text" id="team1-name" value="Team 1" class="team-input">
                <div class="score-display">
                    <span id="score1" class="score-team1">0</span>
                </div>
            </div>
            <div class="vs">VS</div>
            <div class="team-box">
                <input type="text" id="team2-name" value="Team 2" class="team-input">
                <div class="score-display">
                    <span id="score2" class="score-team2">0</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="scoring-sections">
                <div class="score-controls">
                    <p>Team 1 Scored</p>
                    <div class="point-buttons">
                        <button onclick="addPoints(1, 1)">+1</button>
                        <button onclick="addPoints(2, 1)">+2</button>
                        <button onclick="addPoints(3, 1)">+3</button>
                        <button onclick="addPoints(4, 1)">+4</button>
                        <button onclick="addPoints(5, 1)">+5</button>
                    </div>
                </div>
                <div class="score-controls">
                    <p>Team 2 Scored</p>
                    <div class="point-buttons">
                        <button onclick="addPoints(1, 2)">+1</button>
                        <button onclick="addPoints(2, 2)">+2</button>
                        <button onclick="addPoints(3, 2)">+3</button>
                        <button onclick="addPoints(4, 2)">+4</button>
                        <button onclick="addPoints(5, 2)">+5</button>
                    </div>
                </div>
            </div>
            <button id="reset-btn" class="reset-btn">Reset Game</button>
        </div>

        <div id="win-message" class="hidden">
            <h2 id="winner-text"></h2>
            <button onclick="resetGame()" class="primary-btn">New Game</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
